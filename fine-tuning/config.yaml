model:
  base_model: "microsoft/Phi-3-mini-4k-instruct"
  # Alternative small models:
  # - "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  # - "google/gemma-2b-it"
  # - "HuggingFaceTB/SmolLM2-1.7B-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./output"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  bf16: true
  fp16: false
  max_length: 2048
  packing: false
  dataset_text_field: "text"
  remove_unused_columns: false
  report_to: "none"
  log_file: null
  verbose: false

checkpoint:
  resume_from: null
  save_only_model: false

data:
  num_synthetic_samples: 500
  train_split: 0.9
  seed: 42
